// The app's Android build: Qt's template (Qt 6.11) with Chaquopy added, which
// puts Python and yt-dlp inside the app (YouTube songs play through yt-dlp, as
// on the desktop; see src/main/python/ytdlp_bridge.py).
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath 'com.chaquo.python:gradle:17.2.0'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType
apply plugin: 'com.chaquo.python'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.media:media:1.7.0' // the lock-screen media notification
}

android {
    // (gradle.properties, written by androiddeployqt, defines the variables below)
    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            kotlin.srcDirs = [qtAndroidDir + '/src', 'src', 'kotlin']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
        options.compilerArgs += ['-Xlint:all']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError = false
    }

    aaptOptions {
        // Do not compress Qt binary resources file
        noCompress 'rcc'
    }

    packagingOptions {
        jniLibs {
            // (Qt 6.11 writes legacyPackaging; Qt 6.10, which CI uses, doesn't)
            useLegacyPackaging = (project.findProperty('legacyPackaging') ?: 'false').toBoolean()
        }
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}

// Python in the app, with yt-dlp (pinned; the app downloads newer ones itself)
chaquopy {
    defaultConfig {
        version = "3.14"
        pip {
            install "yt-dlp==2026.10.26"
        }
    }
}
