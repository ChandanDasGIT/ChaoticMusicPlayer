# Builds the app on every push and pull request, so a change that breaks a
# platform shows up at once. (More platforms join as they are added; releases
# have their own workflow.)
name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools and libraries
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc-c++ cmake ninja-build pkgconf
          qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel
          ffmpeg-free-devel pipewire-devel taglib-devel libicu-devel libcurl-devel json-devel
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      # Our vcpkg, pinned. (Not VCPKG_ROOT here: the compiler setup below sets
      # that to Visual Studio's own copy; Configure / Build pass ours instead.)
      CMP_VCPKG_DIR: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v5
      - name: Microsoft's compiler
        uses: ilammy/msvc-dev-cmd@v1
      # Qt 6.10: the installer behind this action (aqtinstall 3.3) can't read Qt
      # 6.11's download layout yet. The app needs Qt 6.10+; move to 6.11 here
      # once aqtinstall supports it.
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true
      - name: vcpkg (at the baseline in release/vcpkg.json)
        shell: bash
        run: |
          baseline=$(python -c "import json; print(json.load(open('release/vcpkg.json'))['builtin-baseline'])")
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg.git "$CMP_VCPKG_DIR"
          git -C "$CMP_VCPKG_DIR" checkout "$baseline"
          "$CMP_VCPKG_DIR/bootstrap-vcpkg.bat" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Built libraries from earlier runs
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('release/vcpkg.json') }}
          restore-keys: vcpkg-windows-
      - name: Configure (vcpkg builds the libraries here)
        env:
          VCPKG_ROOT: ${{ env.CMP_VCPKG_DIR }}
        run: cmake --preset windows-release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      # Kept even if our build fails below, so the next run doesn't rebuild them
      - name: Keep the built libraries
        if: always() && steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('release/vcpkg.json') }}
      - name: Build
        env:
          VCPKG_ROOT: ${{ env.CMP_VCPKG_DIR }}
        run: cmake --build --preset windows-release -- -k 0 # (all errors at once, not just the first)
      - name: Portable folder (app, Qt, libraries, yt-dlp)
        shell: bash
        run: |
          dist=dist/ChaoticMusicPlayer
          mkdir -p "$dist"
          cp build/windows-release/ChaoticMusicPlayer.exe build/windows-release/*.dll "$dist"/
          windeployqt --release --qmldir . --no-translations --no-compiler-runtime "$dist/ChaoticMusicPlayer.exe"
          # Not for users: QML debugging plugins; Windows' own ICU (copied from this
          # build machine's system folder; every Windows 10 / 11 has its own)
          rm -rf "$dist/qmltooling" "$dist/icuuc.dll" "$dist/icuin.dll"
          # Microsoft's C++ runtime next to the app: nothing to install first
          cp "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC*.CRT/*.dll "$dist"/
          # Qt's plugins and QML modules: only these, next to the app
          printf '[Paths]\nPrefix = .\nPlugins = .\nQmlImports = qml\n' > "$dist/qt.conf"
          curl -sSLo "$dist/yt-dlp.exe" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          cp LICENSE "$dist"/
      - name: Upload the ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChaoticMusicPlayer-windows-x64
          path: dist/

  # The Linux packages (AppImage, tarball), built on Ubuntu 24.04 so they run
  # on systems that new or newer (release/linux/make-packages.sh)
  linux-packages:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libpipewire-0.3-dev \
            libicu-dev libcurl4-openssl-dev nlohmann-json3-dev zlib1g-dev libutfcpp-dev \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libdbus-1-3 file
      - name: TagLib 2 (Ubuntu 24.04 has 1.13)
        run: |
          curl -fsSLo taglib.tar.gz https://github.com/taglib/taglib/releases/download/v2.3.2/taglib-2.3.2.tar.gz
          echo "3ca2d8afaa7f1cf7f6ed10e511ebc368bfacd6dcaa3dbfa690b89e502e8963dc  taglib.tar.gz" | sha256sum -c
          tar xf taglib.tar.gz
          cmake -S taglib-2.3.2 -B taglib-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF
          cmake --build taglib-build
          sudo cmake --install taglib-build
          sudo ldconfig
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          cache: true
      - name: Configure
        run: cmake --preset linux-release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      - name: Build
        run: cmake --build --preset linux-release -- -k 0
      - name: AppImage and tarball
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: release/linux/make-packages.sh build/linux-release dist
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: ChaoticMusicPlayer-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  # The Flatpak, in Flathub's own build container (release/linux/flatpak)
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ChaoticMusicPlayer-x86_64.flatpak
          manifest-path: release/linux/flatpak/io.github.chandandasgit.ChaoticMusicPlayer.yml
          cache-key: flatpak-builder-${{ hashFiles('release/linux/flatpak/*.yml') }}
