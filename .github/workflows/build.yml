# Builds the app on every push and pull request, so a change that breaks a
# platform shows up at once. (More platforms join as they are added; releases
# have their own workflow.)
name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools and libraries
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc-c++ cmake ninja-build pkgconf
          qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel
          ffmpeg-free-devel pipewire-devel taglib-devel libicu-devel libcurl-devel json-devel
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      # Our vcpkg, pinned. (Not VCPKG_ROOT here: the compiler setup below sets
      # that to Visual Studio's own copy; Configure / Build pass ours instead.)
      CMP_VCPKG_DIR: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v5
      - name: Microsoft's compiler
        uses: ilammy/msvc-dev-cmd@v1
      # Qt 6.10: the installer behind this action (aqtinstall 3.3) can't read Qt
      # 6.11's download layout yet. The app needs Qt 6.10+; move to 6.11 here
      # once aqtinstall supports it.
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true
      - name: vcpkg (at the baseline in release/vcpkg.json)
        shell: bash
        run: |
          baseline=$(python -c "import json; print(json.load(open('release/vcpkg.json'))['builtin-baseline'])")
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg.git "$CMP_VCPKG_DIR"
          git -C "$CMP_VCPKG_DIR" checkout "$baseline"
          "$CMP_VCPKG_DIR/bootstrap-vcpkg.bat" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Built libraries from earlier runs
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('release/vcpkg.json') }}
          restore-keys: vcpkg-windows-
      - name: Configure (vcpkg builds the libraries here)
        env:
          VCPKG_ROOT: ${{ env.CMP_VCPKG_DIR }}
        run: cmake --preset windows-release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      # Kept even if our build fails below, so the next run doesn't rebuild them
      - name: Keep the built libraries
        if: always() && steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('release/vcpkg.json') }}
      - name: Build
        env:
          VCPKG_ROOT: ${{ env.CMP_VCPKG_DIR }}
        run: cmake --build --preset windows-release -- -k 0 # (all errors at once, not just the first)
      - name: Portable folder (app, Qt, libraries, yt-dlp)
        shell: bash
        run: |
          dist=dist/TunedChaos
          mkdir -p "$dist"
          cp build/windows-release/TunedChaos.exe build/windows-release/*.dll "$dist"/
          windeployqt --release --qmldir . --no-translations --no-compiler-runtime "$dist/TunedChaos.exe"
          # Not for users: QML debugging plugins; Windows' own ICU (copied from this
          # build machine's system folder; every Windows 10 / 11 has its own)
          rm -rf "$dist/qmltooling" "$dist/icuuc.dll" "$dist/icuin.dll"
          # Microsoft's C++ runtime next to the app: nothing to install first
          cp "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC*.CRT/*.dll "$dist"/
          # Qt's plugins and QML modules: only these, next to the app
          printf '[Paths]\nPrefix = .\nPlugins = .\nQmlImports = qml\n' > "$dist/qt.conf"
          curl -sSLo "$dist/yt-dlp.exe" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          cp LICENSE "$dist"/
      # The packaged app must start on a real Windows: run it from the folder
      # for a while with Qt's plugin log (offline: requests go to a dead proxy).
      # Fails if it quits early; the log shows why.
      - name: Start-up test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "startup.log"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $env:QT_DEBUG_PLUGINS = "1"
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          Get-ChildItem dist/TunedChaos/platforms
          $app = Start-Process dist/TunedChaos/TunedChaos.exe -PassThru -RedirectStandardError $log
          Start-Sleep -Seconds 20
          $exited = $app.HasExited
          if (-not $exited) { Stop-Process -Id $app.Id -Force }
          Get-Content $log -TotalCount 60
          if ($exited) { Write-Error "The app quit at start (exit code $($app.ExitCode))"; exit 1 }
          Write-Output "The app was still running after 20 seconds"
      - name: Upload the ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TunedChaos-windows-x64
          path: dist/
      # The installer (Inno Setup): the same folder, installed per user
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(TunedChaos VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\dist\TunedChaos" "/DOutputDir=$PWD\installer" release\windows\TunedChaos.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem installer
      # Installs it silently, starts the installed app, then uninstalls it
      - name: Installer test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\*.exe)[0].FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Programs\TunedChaos"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Tuned Chaos.lnk"
          if (-not (Test-Path "$dir\TunedChaos.exe")) { Write-Error "Not installed in $dir"; exit 1 }
          if (-not (Test-Path $shortcut)) { Write-Error "No Start menu entry"; exit 1 }
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          $app = Start-Process "$dir\TunedChaos.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Write-Error "The installed app quit at start (exit code $($app.ExitCode))"; exit 1 }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3 # (the uninstaller finishes from a copy of itself)
          if (Test-Path "$dir\TunedChaos.exe") { Write-Error "Still installed after uninstalling"; exit 1 }
          if (Test-Path $shortcut) { Write-Error "Start menu entry left behind"; exit 1 }
          Write-Output "Installed, started and uninstalled"
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: TunedChaos-windows-x64-setup
          path: installer/*.exe

  # The Android app for phones (arm64 APK). Signed with the release key (GitHub
  # secrets); where there are none (pull requests), left unsigned.
  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Chaquopy installs yt-dlp into the app with the same Python version the
      # app carries (android/build.gradle: 3.14)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Android SDK parts
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # Qt 6.10 as for Windows (aqtinstall can't read 6.11's layout yet), with
      # the desktop Qt its build tools run from
      - name: Qt for Android
        run: |
          pip install -q aqtinstall
          aqt install-qt linux android 6.10.3 android_arm64_v8a --autodesktop -O "$RUNNER_TEMP/Qt"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/6.10.3/gcc_64" >> "$GITHUB_ENV"
          echo "QT_ANDROID_ARM64=$RUNNER_TEMP/Qt/6.10.3/android_arm64_v8a" >> "$GITHUB_ENV"
      - name: vcpkg (at the baseline in release/vcpkg.json)
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('release/vcpkg.json'))['builtin-baseline'])")
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Built libraries from earlier runs
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-android-arm64-${{ hashFiles('release/vcpkg.json') }}
          restore-keys: vcpkg-android-arm64-
      - name: Configure (vcpkg builds the libraries here)
        run: cmake --preset android-arm64
      # Kept even if our build fails below, so the next run doesn't rebuild them
      - name: Keep the built libraries
        if: always() && steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-android-arm64-${{ hashFiles('release/vcpkg.json') }}
      - name: Build the APK
        run: cmake --build --preset android-arm64 --target apk
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version=$(sed -n 's/^project(TunedChaos VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          unsigned=build/android-arm64/android-build/build/outputs/apk/release/android-build-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p apk
          if [ -z "$KEYSTORE" ]; then
              cp "$unsigned" "apk/TunedChaos-$version-arm64-unsigned.apk"
              exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out "apk/TunedChaos-$version-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "apk/TunedChaos-$version-arm64.apk" | grep -m2 "SHA-256\|DN"
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TunedChaos-android-arm64
          path: apk/*.apk

  # The Linux packages (AppImage, tarball), built on Ubuntu 24.04 so they run
  # on systems that new or newer (release/linux/make-packages.sh)
  linux-packages:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libpipewire-0.3-dev \
            libicu-dev libcurl4-openssl-dev nlohmann-json3-dev zlib1g-dev libutfcpp-dev \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libdbus-1-3 file
      - name: TagLib 2 (Ubuntu 24.04 has 1.13)
        run: |
          curl -fsSLo taglib.tar.gz https://github.com/taglib/taglib/releases/download/v2.3.2/taglib-2.3.2.tar.gz
          echo "3ca2d8afaa7f1cf7f6ed10e511ebc368bfacd6dcaa3dbfa690b89e502e8963dc  taglib.tar.gz" | sha256sum -c
          tar xf taglib.tar.gz
          cmake -S taglib-2.3.2 -B taglib-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF
          cmake --build taglib-build
          sudo cmake --install taglib-build
          sudo ldconfig
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          cache: true
      - name: Configure
        run: cmake --preset linux-release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      - name: Build
        run: cmake --build --preset linux-release -- -k 0
      - name: AppImage and tarball
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: release/linux/make-packages.sh build/linux-release dist
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: TunedChaos-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.xz
            dist/SHA256SUMS.txt

  # The Flatpak, in Flathub's own build container (release/linux/flatpak)
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: TunedChaos-x86_64.flatpak
          manifest-path: release/linux/flatpak/io.github.chandandasgit.TunedChaos.yml
          cache-key: flatpak-builder-${{ hashFiles('release/linux/flatpak/*.yml') }}
